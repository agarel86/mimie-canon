<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Jeux CE2 — ORTHOBOUM & CALCTETRIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #070b16; color: #f4f1ea; font-family: Nunito, sans-serif; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(900px 500px at 20% 0%, #1a2a6c 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 80%, #3a1d4a 0%, transparent 50%),
        #070b16;
    }
    main { width: min(720px, 100%); text-align: center; }
    h1 {
      font-family: Fredoka, sans-serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      margin: 0 0 8px;
      letter-spacing: .04em;
    }
    .lead { margin: 0 0 28px; color: #c9d2e3; font-weight: 800; }
    .games { display: grid; gap: 16px; }
    @media (min-width: 640px) { .games { grid-template-columns: 1fr 1fr; } }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 28px 22px 24px;
      border-radius: 28px;
      background: rgba(255,253,248,.08);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }
    a.card:hover { transform: translateY(-2px); background: rgba(255,253,248,.12); }
    .ico { font-size: 3rem; line-height: 1; }
    h2 { font-family: Fredoka, sans-serif; margin: 10px 0 6px; font-size: 1.7rem; }
    p { margin: 0; color: #d5dceb; font-weight: 700; }
    .ortho { border-top: 6px solid #ffc14d; }
    .calc { border-top: 6px solid #5ee0a0; }
  </style>
</head>
<body>
  <main>
    <h1>Jeux CE2</h1>
    <p class="lead">Choisis ton jeu. Tout reste sur cet appareil.</p>
    <div class="games">
      <a class="card ortho" href="ORTHOBOUM/">
        <div class="ico" aria-hidden="true">🦉</div>
        <h2>ORTHOBOUM</h2>
        <p>Explose les fautes d’orthographe.</p>
      </a>
      <a class="card calc" href="CALCTETRIS/">
        <div class="ico" aria-hidden="true">🧱</div>
        <h2>CALCTETRIS</h2>
        <p>Un calcul, puis tu places la pièce.</p>
      </a>
    </div>
  </main>
</body>
</html>
